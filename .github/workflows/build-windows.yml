name: Build Windows App (.exe)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    permissions:
      contents: write
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri Windows App (.exe)
        uses: tauri-apps/tauri-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'Plywood POS v__VERSION__'
          releaseBody: 'Production release for Windows (.exe / .msi)'
          releaseDraft: true
          prerelease: false

      - name: Upload Windows Executable and Installer (.exe)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Plywood-POS-Windows-x64
          path: |
            src-tauri/target/release/Plywood POS.exe
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: warn

